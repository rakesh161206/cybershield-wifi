# CyberShield Wi-Fi — container preview.
#
#   docker compose up --build
#   open http://127.0.0.1:8000
#
# The container cannot inspect the host's Wi-Fi, ARP table or packets.
# Use ./run.sh on the host for live checks and collection.
services:
  cybershield:
    build: .
    image: cybershield-wifi:preview
    container_name: cybershield-preview
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CYBERSHIELD_HOST: "0.0.0.0"
      PORT: "8000"
      CYBERSHIELD_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CYBERSHIELD_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    volumes:
      - cybershield-data:/app/backend
    restart: unless-stopped

volumes:
  cybershield-data:
